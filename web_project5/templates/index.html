<!DOCTYPE html>
<html>
<head>
    <title>Jinja2 Loops and Conditions</title>
</head>
<body>

    <h1>Fruit List</h1>

    {% if fruits %}

        <ul>
            {% for fruit in fruits %}
                <li>{{ fruit }}</li>
            {% endfor %}
        </ul>

    {% else %}

        <p>No fruits available.</p>

    {% endif %}

</body>
</html>
