<!DOCTYPE html>
<html>
<head>
    <title>SQLite Database</title>
</head>
<body>

    <h1>Student Database</h1>

    <form method="POST">

        <input type="text" name="name" placeholder="Enter Name" required>

        <input type="submit" value="Save">

    </form>

    <hr>

    <h2>Student List</h2>

    <ul>

    {% for student in students %}

        <li>{{ student[0] }} - {{ student[1] }}</li>

    {% endfor %}

    </ul>

</body>
</html>
